name: Build Pinned Base and Wrapper

on:
  workflow_dispatch:

env:
  JEG_VERSION: 3.2.3

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wrapper Repository
        uses: actions/checkout@v4
        with:
          path: wrapper-repo
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Prepare Charts Directory
        run: mkdir --parents charts

      - name: Fetch Upstream Enterprise Gateway
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jupyter-server/enterprise_gateway.git jeg-upstream
          cd jeg-upstream
          git sparse-checkout set etc/kubernetes/helm/enterprise-gateway
          
          mv etc/kubernetes/helm/enterprise-gateway ../charts/enterprise-gateway
          cd ..
          rm --force --recursive jeg-upstream

      - name: Pin Base Chart Version
        run: |
          CHART_PATH="./charts/enterprise-gateway/Chart.yaml"
          sed --in-place 's/^version: .*/version: ${{ env.JEG_VERSION }}/' $CHART_PATH
          sed --in-place 's/^appVersion: .*/appVersion: ${{ env.JEG_VERSION }}/' $CHART_PATH
          echo "Pinned upstream chart to version ${{ env.JEG_VERSION }}"

      - name: Move Wrapper Chart
        run: |
          cp --recursive wrapper-repo/my-wrapper-chart ./charts/my-wrapper-chart

      - name: Configure Wrapper Dependency
        run: |
          CHART_FILE="./charts/my-wrapper-chart/Chart.yaml"
          
          sed --in-place 's/version: ".*"/version: "${{ env.JEG_VERSION }}"/' $CHART_FILE
          sed --in-place 's|repository: .*|repository: "file://../enterprise-gateway"|' $CHART_FILE
          cat $CHART_FILE

      - name: Run Chart Releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
